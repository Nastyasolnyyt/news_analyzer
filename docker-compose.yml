services:
  ml-base:
      build:
        context: ./docker/ml-base
        dockerfile: Dockerfile
      image: news_analyzer-ml-base:latest
      # Этот сервис не запускается, только для сборки
      profiles: ["build"]

  db:
    image: postgres:15-alpine
    container_name: news_postgres
    restart: always
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_analysis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:          
      - news_network

  redis:
    image: redis:7-alpine
    container_name: kg_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - news_network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always
    networks:
      - news_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - news_network

  output_module:
    build: ./services/output_module
    ports:
       - "8003:8000"
    env_file:
       - .env
    depends_on:
       - elasticsearch
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
       test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
       interval: 10s
       timeout: 5s
       retries: 5
    restart: always
    networks:
       - news_network

  notification-consumer:
    build:
      context: ./services/output_module
      dockerfile: Dockerfile.consumer
    container_name: notification-consumer
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: articles_analyzed
      KAFKA_NOTIFICATION_GROUP_ID: notifications-sender-group
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_ENABLED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_started
    restart: always
    networks:
      - news_network

  # НОВЫЙ СЕРВИС: Анализ тональности
  sentiment_analysis:
      build: ./services/sentiment_analysis
      container_name: sentiment_analysis
      restart: always
      env_file:
        - .env
      environment:
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        KAFKA_TOPIC: text_for_sentiment
        DATABASE_URL: ${DATABASE_URL}
      depends_on:
        kafka:
          condition: service_healthy
      networks:
        - news_network

  # НОВЫЙ СЕРВИС: Кластеризация событий

  event-clustering:
    build: ./services/event-clustering
    container_name: event_clustering
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - news_network

  # СЕРВИСЫ-ПАРСЕРЫ
  aggregator-parser:
    build: ./services/aggregator-parser-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      kafka:
        condition: service_healthy
      # output_module:
      #   condition: service_healthy
    restart: always
    networks:
      - news_network

  telegram-parser:
    build: ./services/telegram-parser-service
    ports:
    - "8002:8000" 
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
    depends_on:
      kafka:
        condition: service_healthy
      # output_module:
      #   condition: service_healthy
    restart: always
    networks:
      - news_network

  # СИНХРОНИЗАТОР
  elasticsearch-sync:
    build: ./services/elasticsearch-sync
    env_file:
      - .env
    environment:
      POSTGRES_DB_URL: ${POSTGRES_DB_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
      # output_module:
      #   condition: service_healthy
    restart: always
    networks:
      - news_network


  ner-service:
    build: ./services/ner-service
    container_name: ner-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: text_for_ner
      OUTPUT_TOPIC: entities_extracted
    depends_on:
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - news_network

  knowledge-graph-sync:
    build: ./services/knowledge-graph-sync
    container_name: knowledge_graph_sync
    restart: unless-stopped
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      # Настройки из твоего config.py
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: entities_extracted
      KAFKA_GROUP_ID: knowledge-graph-sync-group
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - news_network

  anomaly_detection:
    build:
      context: ./services/anomaly_detection
      dockerfile: Dockerfile
    container_name: news-anomaly-analyzer
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - news_network
    depends_on:
      - output_module

  # ОСТАЛЬНЫЕ СЕРВИСЫ
  text-preprocessing:
    build: ./services/text-preprocessing-service
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: ${DATABASE_URL}
      INPUT_TOPIC: raw_articles
      OUTPUT_TOPIC_NER: text_for_ner
      OUTPUT_TOPIC_RISK: text_for_risk
      OUTPUT_TOPIC_SENTIMENT: text_for_sentiment
      OUTPUT_TOPIC_ANOMALY: text_for_anomaly
      OUTPUT_TOPIC_SYNC: text_for_kg_sync
    depends_on:
      kafka:
        condition: service_healthy
      # output_module:
      #   condition: service_healthy
    restart: always
    networks:
      - news_network

  risk-classifier:
    build: ./services/risk-classifier
    container_name: risk-classifier
    restart: always
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: text_for_risk
      OUTPUT_TOPIC: risk_types_done
      DB_URL: ${DATABASE_URL}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      # ДОБАВЬ ЭТО, чтобы Kafka не выкидывала сервис, пока он грузит модель
      KAFKA_SESSION_TIMEOUT_MS: 45000 
    depends_on:
      - kafka  # УПРОСТИЛИ: убрали condition, чтобы не зависеть от healthcheck
    networks:
      - news_network

  risklevel-classifier:
    build: ./services/risklevel-classifier
    container_name: risklevel-classifier
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: ${DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Поменяй версию группы на v2 (так как v1 в логах Kafka уже помечена как упавшая)
      KAFKA_GROUP_ID: force-reset-group-v2 
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: risk_types_done
      OUTPUT_TOPIC: risk_final_ready
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      # Тоже добавь таймаут
      KAFKA_SESSION_TIMEOUT_MS: 45000
    depends_on:
      - kafka  # УПРОСТИЛИ
    networks:
      - news_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - news_network


networks:
  news_network:
    driver: bridge


volumes:
  postgres_data: