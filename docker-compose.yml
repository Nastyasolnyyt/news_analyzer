   # networks:
    #  - news_network

 # event-clustering:
   # build: ./services/event-clustering
   # container_name: news_analyzer-event-clustering
   # env_file:
    #  - .env
   # environment:
  #    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
   #   DATABASE_URL: ${DATABASE_URL}
  #  deploy:
