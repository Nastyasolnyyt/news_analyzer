version: '3.9'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - news_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_network

  aggregator-parser:
    build: ./services/aggregator-parser-service
    ports:
      - "8000:8000"
    env_file:
      - .env  # Чтобы Docker прочитал твой файл с паролями
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
      # Берем переменную из твоего .env
      DATABASE_URL: ${DATABASE_URL} 
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  news-site-parser:
    build: ./services/news-site-parser-service
    ports:
      - "8001:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  telegram-parser:
    build: ./services/telegram-parser-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  text-preprocessing:
    build: ./services/text-preprocessing-service
    # 1. Обязательно подключаем файл с секретами
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 2. Пробрасываем URL базы данных из .env
      DATABASE_URL: ${DATABASE_URL}
      INPUT_TOPIC: raw_articles
      OUTPUT_TOPIC_NER: text_for_ner
      OUTPUT_TOPIC_RISK: text_for_risk
      OUTPUT_TOPIC_SENTIMENT: text_for_sentiment
      # 3. Добавляем недостающие топики для соответствия коду
      OUTPUT_TOPIC_ANOMALY: text_for_anomaly
      OUTPUT_TOPIC_SYNC: text_for_kg_sync
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    # Проверьте, что имя файла в команде совпадает с вашим (в коде обычно main.py или preprocessing.py)
    command: >
      sh -c "sleep 10 && python text_preprocessing_service_kafka.py"
    networks:
      - news_network

  risk-classifier:
    build: ./services/risk-classifier
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: text_for_risk
      OUTPUT_TOPIC: risk_classified
      db_url: ${POSTGRES_DB_URL}
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - news_network

  #sentiment-analysis:
  #  build:
   #   context: ./services/sentiment_analysis  
    #  dockerfile: Dockerfile        
   # container_name: news_analyzer-sentiment
   # env_file:
    #  - .env
    #environment:
    #  - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
     # - DATABASE_URL=${DATABASE_URL}
    #deploy:
     # resources:
