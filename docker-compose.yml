    #    limits:
    #      memory: 2G
 #   depends_on:
    #  kafka:
   #     condition: service_healthy
    #networks:
    #  - news_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "password" ]
    networks:
      - news_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - news_network

  elasticsearch-sync:
    build: ./services/elasticsearch-sync
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure
    networks:
      - news_network

  output_module:
    build: ./services/output_module
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      - elasticsearch
    networks:
      - news_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8003
    depends_on:
      - output_module
    profiles: ["with-frontend"]
    networks:
      - news_network

networks:
  news_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16