version: '3.9'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - news_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Помогает избежать ошибки NodeExists при быстрых перезапусках
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 6000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - news_network

  aggregator-parser:
    build: ./services/aggregator-parser-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  news-site-parser:
    build: ./services/news-site-parser-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  telegram-parser:
    build: ./services/telegram-parser-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_articles
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  text-preprocessing:
    build: ./services/text-preprocessing-service
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: ${DATABASE_URL}
      INPUT_TOPIC: raw_articles
      OUTPUT_TOPIC_NER: text_for_ner
      OUTPUT_TOPIC_RISK: text_for_risk
      OUTPUT_TOPIC_SENTIMENT: text_for_sentiment
      OUTPUT_TOPIC_ANOMALY: text_for_anomaly
      OUTPUT_TOPIC_SYNC: text_for_kg_sync
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    # Увеличил sleep, чтобы Кафка точно успела прочухаться
    command: >
      sh -c "sleep 15 && python text_preprocessing_service_kafka.py"
    networks:
      - news_network

  risk-classifier:
    build: ./services/risk-classifier
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: text_for_risk
      OUTPUT_TOPIC: risk_classified
      db_url: ${DATABASE_URL}
      PYTHONUNBUFFERED: "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - news_network

  

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "password" ]
    networks:
      - news_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - news_network

  elasticsearch-sync:
    build: ./services/elasticsearch-sync
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - news_network

  output_module:
    build: ./services/output_module
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - news_network

networks:
  news_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16